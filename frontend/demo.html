<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · The Original Green Platform</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="demo-page">
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">CA</span>
        <span>The Original Green</span>
      </a>
      <a class="btn btn-ghost btn-small" href="index.html">Back to home</a>
    </div>
  </header>

  <section class="controls">
    <div class="wrap controls-grid">
      <div class="control">
        <p class="control-label" id="profile-label">User type</p>
        <div class="seg" id="profile-toggle" role="group" aria-labelledby="profile-label"></div>
      </div>
      <div class="control">
        <p class="control-label" id="path-label">Data source</p>
        <div class="seg" id="path-toggle" role="group" aria-labelledby="path-label"></div>
      </div>
    </div>
  </section>

  <div class="wrap demo-layout">
    <nav class="stepper" id="stepper" aria-label="Pipeline steps"></nav>
    <section class="stage" id="stage" aria-live="polite"></section>
  </div>

  <footer class="demo-footer">
    <div class="wrap">
      <p><strong>Demo mode.</strong> Each view is the output of the pipeline (intake, calculator, report) run on demo datasets. Not live tracker data.
        Factors marked as placeholders count as zero and are flagged in the notes.</p>
    </div>
  </footer>

  <script src="data/demo_fixtures.js"></script>
  <script src="assets/demo.js"></script>
</body>
</html>

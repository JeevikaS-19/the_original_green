<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your footprint · The Original Green</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/individual.css">
</head>
<body>
  <header class="ind-top">
    <a class="logo" href="index.html">The Original Green</a>
    <nav><a href="dashboard.html#individual/open/overview">Dashboard</a></nav>
  </header>

  <main class="ind wrap">
    <section class="ind-intro">
      <p class="kicker">Individual tracker</p>
      <h1>Your footprint, from your own activities</h1>
      <div class="mode" role="group" aria-label="Mode">
        <button type="button" data-mode="demo" aria-pressed="true">Demo</button>
        <button type="button" data-mode="live" aria-pressed="false">Your tracker</button>
      </div>
      <p class="muted" id="mode-note"></p>
    </section>

    <section class="dcard">
      <div class="dcard-head"><h2 id="table-title">Activities</h2><span class="muted small" id="saved-note"></span></div>
      <div class="tbl-wrap"><table class="tbl ind-tbl">
        <thead><tr><th>Scope</th><th>Activity</th><th class="num">Amount</th><th>Unit</th><th class="num">tCO₂e a year</th><th>Source</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <form id="add" class="ind-add" autocomplete="off">
        <label>Activity
          <select name="kind" id="kind"></select>
        </label>
        <label>Amount<input type="number" name="qty" min="0" step="any" required></label>
        <label>Source
          <select name="source">
            <option value="Own record">Own record</option>
            <option value="Estimate">Estimate</option>
          </select>
        </label>
        <button class="btn" type="submit" id="submit">Add activity</button>
        <button class="btn btn-ghost" type="button" id="cancel" hidden>Cancel</button>
      </form>
      <p class="hint" id="add-hint"></p>
    </section>

    <section class="ind-result" id="result" aria-live="polite"></section>
  </main>
  <script src="assets/individual.js"></script>
</body>
</html>
